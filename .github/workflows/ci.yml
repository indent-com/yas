name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Parse all Nix files
        run: find . -name '*.nix' -exec nix-instantiate --parse {} + > /dev/null

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: ./bin/lint --check
      - name: Check crates.io publication plan
        run: ./bin/publish-crates --plan

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: ./bin/tests

  protocol-fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Fuzz every YAS wire surface
        run: ./bin/fuzz
        env:
          YAS_FUZZ_SECONDS: "60"

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: ./bin/e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7

  coverage:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run tests with coverage
        run: ./bin/coverage
      - name: Write coverage summary
        run: cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage-report/html/
          retention-days: 30
      - name: Post coverage summary on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: coverage-summary.txt

  build-packages:
    uses: ./.github/workflows/_build-packages.yml
    with:
      macos: true

  build-windows:
    uses: ./.github/workflows/_build-windows.yml
