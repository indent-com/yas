[[request]]
name = "HELLO"
kind = 0x0000
direction = "client_to_server"
sensitive = "allowed"
compression = "forbidden"
datagram = "forbidden"
layout = "ClientHello; ResultPrefix + ServerHello"

[[request]]
name = "PING"
kind = 0x0001
direction = "bidirectional"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "sender_monotonic_ns:u64; ResultPrefix + receiver_receive_ns:u64,receiver_send_ns:u64"

[[request]]
name = "CANCEL"
kind = 0x0002
direction = "bidirectional"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "target_request_id:u32; ResultPrefix"

[[request]]
name = "SESSION_INFO"
kind = 0x0003
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "empty; ResultPrefix + SessionInfo"

[[request]]
name = "CLIENT_UPDATE"
kind = 0x0004
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "Extensions; ResultPrefix"

[[request]]
name = "SHUTDOWN"
kind = 0x0005
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "operation_id:[u8;16] nonzero,grace_ns:u64,reason:string_u32; ResultPrefix"

[[event]]
name = "GOAWAY"
kind = 0x0000
direction = "server_to_client"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "status:u16,reserved:u16=0,close_deadline_server_ns:u64,detail:Extensions"

[[event]]
name = "SESSION_UPDATE"
kind = 0x0001
direction = "server_to_client"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "catalog_revision:u64 nonzero,ReceiveLimits replacement,Extensions"

[[event]]
name = "FAMILY_UPDATE"
kind = 0x0002
direction = "server_to_client"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "catalog_revision:u64 nonzero,FamilyDescriptor complete replacement"

