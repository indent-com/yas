schema = 1
family = "yas.fs"

limits = [
  { name = "MAX_ROOTS_PER_SESSION", tag = 1, type = "u32", required = true, hard_min = 1, hard_max = 64 },
  { name = "MAX_WATCHES_PER_ROOT", tag = 2, type = "u32", required = true, hard_min = 1, hard_max = 32 },
  { name = "MAX_PATH_COMPONENTS", tag = 3, type = "u32", required = true, hard_min = 1, hard_max = 1024 },
  { name = "MAX_COMPONENT_BYTES", tag = 4, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_PATH_BYTES", tag = 5, type = "u32", required = true, hard_min = 1, hard_max = 65535 },
  { name = "MAX_INLINE_BYTES", tag = 6, type = "u32", required = true, hard_min = 1, hard_max = 32768 },
  { name = "MAX_QUERY_RECORDS", tag = 7, type = "u32", required = true, hard_min = 1, hard_max = 8192 },
  { name = "MAX_QUERY_BYTES", tag = 8, type = "u32", required = true, hard_min = 1, hard_max = 4194304 },
  { name = "MAX_STAGES_PER_SESSION", tag = 9, type = "u32", required = true, hard_min = 1, hard_max = 16 },
  { name = "MAX_STAGED_BYTES", tag = 10, type = "u64", required = true, hard_min = 1, hard_max = 67108864 },
  { name = "MAX_BATCH_ITEMS", tag = 11, type = "u32", required = true, hard_min = 1, hard_max = 256 },
  { name = "MAX_QUERY_CONCURRENCY", tag = 12, type = "u32", required = true, hard_min = 1, hard_max = 8 },
  { name = "MAX_CATALOG_ENTRIES", tag = 13, type = "u32", required = true, hard_min = 1, hard_max = 1000000 },
  { name = "CAPABILITIES", tag = 14, type = "u32", required = false, hard_min = 0, hard_max = 4294967295 },
]

[[request]]
name = "OPEN"
kind = 0x0000
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "flags:u16,reserved:u16=0,source:bytes_u32 containing RootSource,Extensions; ResultPrefix + root_handle:u64,root_revision:u64,path_model:u8,case_behavior:u8,reserved:u16=0,canonical_path:bytes_u32,Extensions"
[[request]]
name = "CLOSE"
kind = 0x0001
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "root_handle:u64,Extensions; ResultPrefix; idempotent and invalidates root-scoped watches/stages"
[[request]]
name = "WATCH"
kind = 0x0002
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "root_handle:u64,flags:u16,settle_ms:u16,inline_max:u32,ignore_patterns:bytes_u32,state:bytes_u32 containing StateWatch; ResultPrefix + StateWatchResult"
[[request]]
name = "UNWATCH"
kind = 0x0003
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "subscription_id:u32; ResultPrefix"
[[request]]
name = "FETCH"
kind = 0x0004
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "root_handle:u64,path:bytes_u32 containing WirePath,expected_hash_present:u8,reserved:[u8;3]=0,optional expected_hash:[u8;32],initial_receive_credit:u64,Extensions; ResultPrefix + content:bytes_u32 containing InlineOrTransfer,Extensions"
[[request]]
name = "READ"
kind = 0x0005
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "root_handle:u64,initial_receive_credit:u64,question_count:u16,reserved:u16=0,repeated kind:u16,flags:u16,path:bytes_u32 containing WirePath,Extensions; ResultPrefix + QueryPage"
[[request]]
name = "SEARCH"
kind = 0x0006
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "root_handle:u64,flags:u16,max_results:u16,query:bytes_u16,cursor:bytes_u16,initial_receive_credit:u64,Extensions; ResultPrefix + QueryPage"
[[request]]
name = "INDEX"
kind = 0x0007
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "root_handle:u64,flags:u16,max_results:u16,cursor:bytes_u16,initial_receive_credit:u64,Extensions; ResultPrefix + QueryPage"
[[request]]
name = "GREP"
kind = 0x0008
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "root_handle:u64,flags:u16,max_results:u16,max_per_file:u16,reserved:u16=0,query:bytes_u32,cursor:bytes_u16,initial_receive_credit:u64,Extensions; ResultPrefix + QueryPage"
[[request]]
name = "STAGE_WRITE"
kind = 0x0009
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "root_handle:u64,path:bytes_u32 containing WirePath,precondition:bytes_u32 containing Precondition,flags:u16,reserved:u16=0,mode:u32,byte_len:u64,content_hash:[u8;32],initial_receive_credit:u64,Extensions; ResultPrefix + staging_handle:u64,descriptor:bytes_u32 containing sensitive receiver-to-sender BYTE TransferDescriptor with required upload-stage extension naming that handle,Extensions; before COMMIT succeeds, RESET of the returned descriptor discards the stage; a CONFLICT ResultPrefix detail Extensions contains optional tag RESULT_CONFLICT_DETAIL_EXTENSION with exact ConflictDetail value"
[[request]]
name = "COMMIT"
kind = 0x000a
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "staging_handle:u64,operation_id:[u8;16],flags:u16,reserved:u16=0,Extensions; ResultPrefix + root_revision:u64,entry_revision:u64,modified_unix_ns:i64,content_hash:[u8;32]; a CONFLICT ResultPrefix detail Extensions contains optional tag RESULT_CONFLICT_DETAIL_EXTENSION with exact ConflictDetail value"
[[request]]
name = "APPLY"
kind = 0x000b
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "root_handle:u64,operation_id:[u8;16],flags:u16,item_count:u16,repeated item_len:u32,item_kind:u16,item_flags:u16,item_body,Extensions; ResultPrefix + root_revision:u64,result_count:u16,reserved:u16=0,repeated ApplyItemResult,Extensions"

[[event]]
name = "STATE"
kind = 0x0000
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "StateEvent<EntryRecord|EntryPatch|RemoveRecord|MoveRecord>; known family record kinds includes RECORD_MOVE"
[[event]]
name = "STATE_ACK"
kind = 0x0001
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "StateAck"

[[type]]
name = "wire_path"
layout = "component_count:u16,repeated component:bytes_u16; root is zero components; components are raw platform-name bytes, nonempty, not dot/dot-dot, without NUL or separators; at most 1024 components, 4096 bytes each, 65535 bytes total"
[[type]]
name = "root_source"
layout = "kind:u8,reserved:[u8;3]=0; PLATFORM_PATH path:bytes_u32, TERMINAL_CWD terminal_handle:u64,suffix:bytes_u32 containing WirePath, PROCESS_CWD process_handle:u64, STAGING no body; STAGING is session-owned, created lazily, and survives root CLOSE until session loss"
[[type]]
name = "entry_record"
layout = "path:bytes_u32 containing WirePath,entry_revision:u64,kind:u8,flags:u8,reserved:u16=0,mode:u32,modified_unix_ns:i64; FILE byte_len:u64,content_hash:[u8;32],content_kind:u8,reserved:[u8;3]=0,optional content:bytes_u32; DIRECTORY no body; SYMLINK content_hash:[u8;32],target:bytes_u32 where hash is BLAKE3(target); Extensions"
[[type]]
name = "entry_patch"
layout = "path:bytes_u32 containing WirePath,observed_revision:u64,fields:u16,reserved:u16=0,replacement:bytes_u32 containing complete EntryRecord with identical path; fields states which semantic fields changed"
[[type]]
name = "move_record"
layout = "from:bytes_u32 containing WirePath,to:bytes_u32 containing WirePath,operation_id_present:u8,reserved:[u8;3]=0,optional operation_id:[u8;16]"
[[type]]
name = "remove_record"
layout = "path:bytes_u32 containing WirePath,removed_revision:u64,operation_id_present:u8,reserved:[u8;3]=0,optional operation_id:[u8;16]"
[[type]]
name = "typed_record"
layout = "record_len:u32,kind:u16,flags:u16,body; record_len includes kind and flags; flag bit0 REQUIRED, other bits zero"
[[type]]
name = "query_page"
layout = "next_cursor:bytes_u16,total_hint:u64,flags:u16,reserved:u16=0,delivery:u8,reserved:[u8;3]=0; INLINE record_count:u16,reserved:u16=0,record_stream:bytes_u32; TRANSFER descriptor:bytes_u32 containing sensitive server-to-client MESSAGE TransferDescriptor; Extensions"
[[type]]
name = "query_read_record"
layout = "question_index:u16,status:u16,path_present:u8,reserved:[u8;3]=0,optional path:bytes_u32 containing WirePath,content:bytes_u32; OK content follows the matching question kind: STAT EntryRecord, HASH exactly [u8;32], LINK_TARGET raw target bytes, CONTENT raw file bytes; non-OK content is empty"
[[type]]
name = "query_path_record"
layout = "path:bytes_u32 containing WirePath,flags:u16,reserved:u16=0; used by SEARCH and INDEX"
[[type]]
name = "query_grep_file_record"
layout = "file_index:u32,match_count:u32,flags:u16,reserved:u16=0,path:bytes_u32 containing WirePath; file indices are dense from zero"
[[type]]
name = "query_grep_match_record"
layout = "file_index:u32,line:u32,column:u32,end_line:u32,end_column:u32,text:string_u32; lines and UTF-8 byte columns are zero based and end is exclusive"
[[type]]
name = "query_record_batch"
layout = "nonempty Transfer MESSAGE item: first_record_index:u32,record_count:u16,reserved:u16=0,record_stream:bytes_u32 containing typed records; batches are contiguous from index zero and collectively contain the QueryPage record sequence"
[[type]]
name = "precondition"
layout = "kind:u8,reserved:[u8;3]=0; ANY/ABSENT no body, REVISION revision:u64, HASH content_hash:[u8;32]"
[[type]]
name = "apply_item"
layout = "outer item_flags bit0 CREATE_PARENTS is valid for WRITE_INLINE,MKDIR,RENAME,SYMLINK,HARDLINK and forbidden for REMOVE; WRITE_INLINE path,precondition,mode:u32,content:bytes_u32; MKDIR path,precondition,mode:u32; REMOVE path,precondition,flags:u16,reserved:u16=0; RENAME from,to,precondition; SYMLINK path,target:bytes_u32,precondition; HARDLINK source,target,precondition; all path/precondition values are bytes_u32 encoded"
[[type]]
name = "apply_item_result"
layout = "index:u16,status:u16,entry_revision:u64,modified_unix_ns:i64,content_hash_present:u8,reserved:[u8;3]=0,optional content_hash:[u8;32],detail:string_u16; on CONFLICT revision/hash/time describe the current entry and are zero/absent when it is absent"
[[type]]
name = "conflict_detail"
layout = "path:bytes_u32 containing WirePath,current_present:u8,hash_present:u8,reserved:u16=0,current_entry_revision:u64,modified_unix_ns:i64,optional content_hash:[u8;32]; exact value of optional Core ResultPrefix detail extension tag RESULT_CONFLICT_DETAIL_EXTENSION for STAGE_WRITE or COMMIT status CONFLICT"
[[type]]
name = "entry_operation_id_extension"
layout = "EntryRecord extension tag 1 exact value operation_id:[u8;16], nonzero; lets watchers recognize mutation echoes without suppressing them"
[[type]]
name = "family_limits"
layout = "ordered optional extensions: tags 1..12 encode max roots/session:u32,watches/root:u32,path components:u32,component bytes:u32,path bytes:u32,inline bytes:u32,query records:u32,query bytes:u32,stages/session:u32,staged bytes:u64,batch items:u32,query concurrency:u32"
[[type]]
name = "family_capabilities"
layout = "optional family limit extension tag LIMIT_CAPABILITIES exact value capabilities:u32; bitmask of CAPABILITY_* values the server implements; absent means zero; receivers ignore unknown bits; a client uses an opt-in value only when its capability bit is set"
[[type]]
name = "os_error"
layout = "code:i32,name:bytes_u16,operation:bytes_u16; code is the raw server-platform OS error number, name its symbolic errno name or UNKNOWN (1..=32 bytes of ASCII A-Z 0-9 _), operation the operation the server was performing (1..=32 bytes of ASCII a-z 0-9 _); exact value of optional Core ResultPrefix detail extension tag RESULT_OS_ERROR_EXTENSION on a failed top-level FS Result caused by an OS error, the whole content of a non-OK READ record answering READ_LIST, READ_REALPATH or READ_STAT_ONLY when the failure came from an OS error, and an entry of ApplyOsErrors"
[[type]]
name = "apply_os_errors"
layout = "repeated index:u16,OsError; exact value of optional ApplyResult extension tag APPLY_RESULT_OS_ERRORS_EXTENSION, present only when at least one item failed because of an OS error; one entry per such item, indices strictly ascending and naming non-OK items of the same Result; offered with CAPABILITY_OS_ERROR"
[[type]]
name = "query_read_extended_record"
layout = "QueryReadRecord answering the opt-in question kinds: OK content READ_LIST QueryListEntries, READ_REALPATH raw absolute canonical platform path bytes, READ_STAT_ONLY QueryStatOnly; non-OK content is empty or exactly one OsError; READ_NO_FOLLOW is valid only with READ_STAT_ONLY among these kinds"
[[type]]
name = "query_list_entries"
layout = "repeated kind:u8,name:bytes_u16; one directory level without dot and dot-dot, hidden names included, in no defined order; kind ENTRY_FILE, ENTRY_DIRECTORY, ENTRY_SYMLINK or ENTRY_OTHER describes the entry itself, so a symlink to a directory is ENTRY_SYMLINK; name is one nonempty raw platform-name component without NUL or slash"
[[type]]
name = "query_stat_only"
layout = "kind:u8,reserved:u8=0,reserved:u16=0,mode:u32,size:u64,modified_unix_ns:i64; kind ENTRY_FILE, ENTRY_DIRECTORY, ENTRY_SYMLINK or ENTRY_OTHER; follows the final symlink unless READ_NO_FOLLOW; no content is read or hashed"
[[type]]
name = "stage_in_place"
layout = "STAGE_WRITE flag STAGE_IN_PLACE: COMMIT opens the target write-only with create and truncate, following a final symlink, writes the staged bytes and optionally syncs them; an existing file keeps its inode, owner and mode; a new file gets mode, or 0o666 when mode is zero, less the server umask; no temporary file and no rename; STAGE_CREATE_PARENTS with STAGE_IN_PLACE is INVALID"

