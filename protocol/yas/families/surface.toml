schema = 1
family = "yas.surface"

limits = [
  { name = "MAX_SURFACES_PER_SESSION", tag = 1, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_VIEWS_PER_SESSION", tag = 2, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_VIEW_DIMENSION", tag = 3, type = "u32", required = true, hard_min = 1, hard_max = 4096 },
  { name = "MAX_VIEW_PIXELS", tag = 4, type = "u64", required = true, hard_min = 1, hard_max = 16777216 },
  { name = "MAX_FRAME_RATE", tag = 5, type = "u32", required = true, hard_min = 1, hard_max = 240 },
  { name = "MAX_INLINE_CURSOR_BYTES", tag = 6, type = "u32", required = true, hard_min = 1, hard_max = 32768 },
  { name = "MAX_REMOTE_CONTACTS", tag = 7, type = "u32", required = true, hard_min = 1, hard_max = 64 },
  { name = "MAX_APP_ENDPOINTS_PER_SESSION", tag = 8, type = "u32", required = true, hard_min = 1, hard_max = 1024 },
  { name = "MAX_APP_ENDPOINT_LIFETIME_NS", tag = 9, type = "u64", required = true, hard_min = 1, hard_max = 86400000000000 },
]

[[request]]
name = "WATCH"
kind = 0x0000
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "StateWatch; ResultPrefix + StateWatchResult"
[[request]]
name = "UNWATCH"
kind = 0x0001
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "subscription_id:u32; ResultPrefix"
[[request]]
name = "CREATE_APP_ENDPOINT"
kind = 0x0002
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "operation_id:[u8;16],application_id:string_u16,Extensions; ResultPrefix + app_handle:u64,expires_server_ns:u64,environment_count:u16,repeated key:bytes_u16,value:bytes_u32,Extensions"
[[request]]
name = "OPEN_VIEW"
kind = 0x0003
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "surface_handle:u64,width:u32,height:u32,max_fps:u16,decoder_capacity:u8,codec_count:u8,repeated codec_version:u16,Extensions; ResultPrefix + ViewResult"
[[request]]
name = "CONFIGURE_VIEW"
kind = 0x0004
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32,width:u32,height:u32,max_fps:u16,decoder_capacity:u8,reserved:u8=0,latency_target_ns:u64,Extensions; ResultPrefix"
[[request]]
name = "RESET_VIEW"
kind = 0x0005
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32; ResultPrefix"
[[request]]
name = "CLOSE_VIEW"
kind = 0x0006
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32; ResultPrefix"
[[request]]
name = "CAPTURE"
kind = 0x0007
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "surface_handle:u64,revision:u64,initial_receive_credit:u64,format_count:u8,reserved:[u8;3]=0,repeated format:u8,Extensions; ResultPrefix + InlineOrTransfer"
[[request]]
name = "RESIZE"
kind = 0x0008
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "surface_handle:u64,operation_id:[u8;16],logical_width_32_32:i64,logical_height_32_32:i64,Extensions; ResultPrefix + state_revision:u64"
[[request]]
name = "FOCUS"
kind = 0x0009
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "surface_handle:u64,operation_id:[u8;16],focused:u8,reserved:[u8;7]=0,Extensions; ResultPrefix + state_revision:u64"
[[request]]
name = "CLOSE"
kind = 0x000a
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "surface_handle:u64,operation_id:[u8;16],Extensions; ResultPrefix"
[[request]]
name = "RELEASE_APP_ENDPOINT"
kind = 0x000b
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "app_handle:u64,operation_id:[u8;16],Extensions; ResultPrefix"

[[event]]
name = "STATE"
kind = 0x0000
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "StateEvent<SurfaceRecord>"
[[event]]
name = "STATE_ACK"
kind = 0x0001
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "StateAck"
[[event]]
name = "KEY"
kind = 0x0010
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32,feedback:FrameFeedback,client_monotonic_ns:u64,key_code:u16,state:u8,reserved:u8=0,modifiers:u32"
[[event]]
name = "TEXT"
kind = 0x0011
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32,feedback:FrameFeedback,client_monotonic_ns:u64,text:string_u32"
[[event]]
name = "PREEDIT"
kind = 0x0012
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32,client_monotonic_ns:u64,selection_start:u32,selection_end:u32,cursor:u32,text:string_u32"
[[event]]
name = "POINTER"
kind = 0x0013
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32,feedback:FrameFeedback,client_monotonic_ns:u64,phase:u8,button:u8,reserved:u16=0,x_32_32:i64,y_32_32:i64"
[[event]]
name = "AXIS"
kind = 0x0014
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32,feedback:FrameFeedback,client_monotonic_ns:u64,source:u8,flags:u8,reserved:u16=0,dx_32_32:i64,dy_32_32:i64,steps_x:i32,steps_y:i32"
[[event]]
name = "TOUCH"
kind = 0x0015
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32,client_monotonic_ns:u64,phase:u8,reserved:u8=0,contact_count:u16,repeated contact_id:u32,x_32_32:i64,y_32_32:i64"
[[event]]
name = "FRAME_ACK"
kind = 0x0016
direction = "client_to_server"
sensitive = "allowed"
compression = "allowed"
datagram = "forbidden"
layout = "view_id:u32,presented_sequence:u64,decoder_queue_depth:u16,available_slots:u16"
[[event]]
name = "FRAME"
kind = 0x0020
direction = "server_to_client"
sensitive = "required"
compression = "forbidden"
datagram = "surface_frame"
layout = "view_id:u32,sequence:u64,base_sequence:u64,capture_ns:u64,presentation_ns:u64,flags:u16,codec_version:u16,fragment_index:u16,fragment_count:u16,complete_len:u32,payload:remaining"
[[event]]
name = "REMOTE_INPUT"
kind = 0x0021
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "surface_handle:u64,seat_handle:u64,expires_server_ns:u64,input_kind:u8,reserved:u8=0,contact_count:u16,repeated contact_id:u32,x_32_32:i64,y_32_32:i64; POINTER requires exactly one contact with contact_id=0, TOUCH permits 0..MAX_REMOTE_CONTACTS unique contacts"

[[type]]
name = "surface_record"
layout = "surface_handle:u64,revision:u64,parent_handle:u64,app_handle:u64,lifecycle:u8,reserved:u8=0,composite_width:u32,composite_height:u32,logical_width_32_32:i64,logical_height_32_32:i64,application_id:string_u16,title:string_u16,Extensions"
[[type]]
name = "view_result"
layout = "view_id:u32,codec_version:u16,max_inflight_frames:u16,max_encoded_frame:u32,max_decoded_frame:u32,first_sequence:u64,Extensions"

[[type]]
name = "cursor_state"
layout = "kind:u8,reserved:[u8;3]=0; NAMED name:string_u16, HIDDEN empty, CUSTOM hotspot_x:i32,hotspot_y:i32,width:u32,height:u32,scale_120:u16,reserved:u16=0,png:bytes_u32 (at most 32768 bytes)"
[[type]]
name = "text_input_state"
layout = "flags:u16,reserved:u16=0,content_hint:u32,content_purpose:u32; when HAS_CURSOR_RECT x:i32,y:i32,width:i32,height:i32"
[[type]]
name = "minimum_size"
layout = "width:u32,height:u32; logical pixels, each at most 2147483647; zero means no minimum on that axis"
[[type]]
name = "text_input_request_revision"
layout = "revision:u64; nonzero last committed text-input enable; retained across caret updates, changes request an input panel for existing viewers; initial snapshots do not request a panel"
