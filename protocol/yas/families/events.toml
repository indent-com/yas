[[request]]
name = "GET_CONFIG"
kind = 0x0000
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "Extensions; ResultPrefix + EventConfig"

[[request]]
name = "SET_CONFIG"
kind = 0x0001
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "operation_id:[u8;16],expected_revision:u64,capacity:u64,activations:[u64;4],Extensions; ResultPrefix + EventConfig"

[[request]]
name = "DUMP"
kind = 0x0002
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "initial_receive_credit:u64,Extensions; ResultPrefix + DumpResult"

[[request]]
name = "START_STREAM"
kind = 0x0003
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "operation_id:[u8;16],flags:u16,reserved:u16=0,start_sequence:u64,max_batch_bytes:u32,reserved:u32=0,Extensions; ResultPrefix + StreamStarted"

[[request]]
name = "STOP_STREAM"
kind = 0x0004
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "stream_handle:u64,operation_id:[u8;16],Extensions; ResultPrefix"

[[request]]
name = "START_RECORDING"
kind = 0x0005
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "operation_id:[u8;16],flags:u16,reserved:u16=0,path:bytes_u32,Extensions; ResultPrefix + RecordingInfo"

[[request]]
name = "STOP_RECORDING"
kind = 0x0006
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "recording_handle:u64,operation_id:[u8;16],Extensions; ResultPrefix + RecordingInfo"

[[request]]
name = "LIST_RECORDINGS"
kind = 0x0007
direction = "client_to_server"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "Extensions; ResultPrefix + count:u16,reserved:u16=0,repeated RecordingInfo"

[[event]]
name = "RECORD"
kind = 0x0000
direction = "server_to_client"
sensitive = "required"
compression = "forbidden"
datagram = "forbidden"
layout = "stream_handle:u64,codec_id:u16,codec_version:u16,payload:remaining containing events-v1"

[[event]]
name = "GAP"
kind = 0x0001
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "stream_handle:u64,lost:u64,first_available_sequence:u64"

[[event]]
name = "STREAM_STOPPED"
kind = 0x0002
direction = "server_to_client"
sensitive = "required"
compression = "allowed"
datagram = "forbidden"
layout = "stream_handle:u64,status:u16,reserved:u16=0,detail:string_u32,Extensions"

[[type]]
name = "event_config"
layout = "revision:u64,capacity:u64,used:u64,record_count:u64,dropped:u64,next_sequence:u64,activations:[u64;4],Extensions"

[[type]]
name = "dump_result"
layout = "byte_len:u64,content_hash:[u8;32],descriptor:bytes_u32 containing sensitive server-to-client BYTE TransferDescriptor,Extensions"

[[type]]
name = "stream_started"
layout = "stream_handle:u64,first_sequence:u64,max_batch_bytes:u32,reserved:u32=0,Extensions"

[[type]]
name = "recording_info"
layout = "recording_handle:u64,state:u8,reserved:u8=0,flags:u16,records:u64,bytes:u64,lost:u64,path:bytes_u32,error:string_u32,Extensions"

[[type]]
name = "events_v1_batch"
layout = "first_sequence:u64,record_count:u16,reserved:u16=0,repeated record_len:u32,sequence:u64,monotonic_ns:u64,event_id:u32,flags:u16,reserved:u16=0,payload:remaining-within-record"

[[type]]
name = "family_limits"
layout = "extension tags 1 min_ring_bytes:u64,2 max_ring_bytes:u64,3 max_streams_per_session:u32,4 max_recordings:u32,5 max_recording_path_bytes:u32,6 max_live_batch_bytes:u32,7 max_pending_dumps:u32"
