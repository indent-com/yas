<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>YAS</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><circle cx='128' cy='128' r='120' fill='none' stroke='%23000' stroke-width='16'/><g fill='%23000'><rect x='120' y='128' width='16' height='120'/><rect x='120' y='128' width='16' height='120' transform='rotate(120 128 128)'/><rect x='120' y='128' width='16' height='120' transform='rotate(240 128 128)'/></g></svg>"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><circle cx='128' cy='128' r='120' fill='none' stroke='%23000' stroke-width='16'/><g fill='%23000'><rect x='120' y='128' width='16' height='120'/><rect x='120' y='128' width='16' height='120' transform='rotate(120 128 128)'/><rect x='120' y='128' width='16' height='120' transform='rotate(240 128 128)'/></g></svg>"
    />
    <style>
      :root {
        --yas-system-bar-background: #000;
        --yas-system-bar-inset-top: env(safe-area-inset-top);
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: inherit;
      }
      html,
      body,
      #root {
        width: 100%;
        height: var(--yas-shell-height, 100%);
        background: var(--yas-system-bar-background);
        overflow: hidden;
        /* Unlike hidden, clip also forbids focus/scrollIntoView from moving
           the shell. Only the pane and overlay scrollers should scroll. */
        overflow: clip;
        overscroll-behavior: none;
        /* Single spacing everywhere by default. yas is a terminal first:
           code panes, lists and chrome should all sit on the same tight
           rhythm, and the browser's ~1.2 default was quietly adding
           leading to everything that never set its own. Prose opts back
           out explicitly (the commit message header, diagnostic text,
           switcher subtitles). */
        line-height: 1;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        /* iPadOS can pan the document despite overflow being disabled,
           especially around keyboard/browser-chrome viewport changes. */
        position: var(--yas-shell-position, fixed);
        inset: 0;
      }
      #root {
        /* Keep the root out of the unsafe top/side areas, but let the bottom
           chrome own the bottom inset so it can paint behind the home area. */
        padding: var(--yas-system-bar-inset-top)
          var(--yas-safe-area-right, env(safe-area-inset-right)) 0
          var(--yas-safe-area-left, env(safe-area-inset-left));
      }
      #yas-system-bar-background {
        display: none;
      }
      /* Safari 26 puts a blurred "scroll pocket" between the iPadOS status
         bar and topmost content. A fixed opaque edge is WebKit's signal that
         the application already owns this area, which replaces that pocket
         with the exact palette-derived colour, in Safari and installed apps.
         WebKit samples a 2px band starting 4px inside the viewport and ignores
         background colours on boxes at most 10px tall. Keep the strip above
         fixed workspace content and overlays so neither hides the sample. */
      @supports (-webkit-touch-callout: none) {
        :root {
          --yas-system-bar-inset-top: max(11px, env(safe-area-inset-top));
        }
        #yas-system-bar-background {
          display: block;
          position: fixed;
          inset: 0 0 auto;
          z-index: 50;
          width: 100%;
          height: var(--yas-system-bar-inset-top);
          background-color: var(--yas-system-bar-background);
          pointer-events: none;
        }
      }
      @supports (height: 100dvh) {
        :root {
          --yas-shell-height: 100dvh;
        }
      }
      /* iOS standalone uses viewport-fit=contain (set before mounting the app).
         Keep the body in normal flow without an extra anti-blur spacer. */
      @supports (-webkit-touch-callout: none) {
        @media (display-mode: standalone) {
          :root {
            --yas-shell-position: static;
            --yas-system-bar-inset-top: env(safe-area-inset-top);
          }
        }
        :root[data-yas-standalone] {
          --yas-shell-position: static;
          --yas-system-bar-inset-top: env(safe-area-inset-top);
        }
      }
      /* The native contained viewport already excludes these areas. Some
         WebKit versions still return their physical env() sizes afterwards. */
      :root[data-yas-contained-viewport] {
        --yas-system-bar-inset-top: 0px;
        --yas-safe-area-right: 0px;
        --yas-safe-area-left: 0px;
        --yas-safe-area-bottom: 0px;
      }
    </style>
  </head>
  <body>
    <div id="yas-system-bar-background" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
