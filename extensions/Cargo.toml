# Extensions are a workspace of their own because they are built for a
# different target than everything else in the repository. Members here only
# ever make sense as `wasm32-unknown-unknown` modules, so keeping them out of
# the root workspace stops `cargo build`, `clippy`, and `test` at the root from
# trying to build a Wasm guest for the host.
[workspace]
resolver = "3"
members = ["muster", "systemd", "xdg-desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yas-run/yas"
homepage = "https://yas.run"

[workspace.dependencies]
yas-guest = { path = "../crates/guest" }
yas-wire = { path = "../crates/yas" }

# Extensions are downloaded before they are run, and a Wasm guest gains nothing
# from the speed/size tradeoffs a native binary makes.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
