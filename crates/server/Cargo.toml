[package]
name = "yas-server"
version = "0.2.0"
edition.workspace = true
description = "yas terminal multiplexer server"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "yas_server"
path = "src/lib.rs"

[features]
# Software H.264 encoders for compositor surface streaming (Linux-only, see
# surface_encoder.rs). Independent build-time choices: build with either,
# both (x264 preferred, openh264 as runtime fallback), or neither (software
# fallback is then AV1-only). x264 is GPL-2.0-or-later, which governs
# distribution of binaries that include it — that's why it is off by
# default and an explicit opt-in for releases (see `yas --license`).
default = ["openh264"]
x264 = ["dep:x264-sys"]
openh264 = ["dep:openh264"]

[dependencies]
yas-guest.workspace = true
yas-fssync = { workspace = true }
yas-git = { workspace = true }
yas-lsp = { workspace = true }
yas-terminal-driver = { workspace = true }
yas-terminal-model = { workspace = true }
yas-fonts = { workspace = true }
yas-proxy = { workspace = true }
yas-webserver = { workspace = true }
yas-wire = { workspace = true }
yas-compositor = { workspace = true }
yas-composite-transport = { workspace = true }
yas-sd-notify = { workspace = true }
tokio = { version = "1", features = ["full"] }
# Opt-in TLS termination for relayed streams (docs/design/net.md § TLS
# termination). Same versions as the CLI and WebRTC forwarder
# crates already pin, so nothing new enters the workspace.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
rustls-native-certs = "0.8"
ignore = "0.4"
regex = "1"
serde_json = "1"
memchr = "2"
getrandom = "0.4"
blake3 = { version = "1", default-features = false, features = ["std"] }
# Automatic dispatch avoids recursive tail calls in unoptimized builds.
wasmi = { version = "2.0", default-features = false, features = ["stable", "std", "validate", "auto-dispatch"] }
wasmparser = { version = "0.259", default-features = false, features = ["std"] }
rquickjs = { version = "0.13", default-features = false, features = ["std"] }
redb = "4"
rav1e = { version = "0.8", default-features = false }
avif-serialize = "0.8.9"
half = "2"
ravif = { version = "0.13", default-features = false }
rgb = "0.8"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
smallvec = "1"
rustc-hash = "2"
os_pipe = "1"
notify = "8"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
close_fds = "0.3"
libc = "0.2"
opus = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
yas-desktop = { workspace = true }
ash = { version = "0.38", default-features = false, features = ["loaded"] }
anyhow = "1"
cros-codecs = { path = "../../vendor/cros-codecs", features = ["backend"] }
# Codec-specific software camera decoders.  These are the last-resort path
# when no native NVDEC, VA-API, or Vulkan Video device accepts the exact
# H.264/AV1 profile and chroma format.  Neither dependency uses FFmpeg.
oxideav-core = "0.1.36"
oxideav-h264 = "=0.1.8"
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8"] }
# Software H.264 encoders, enabled by the features of the same names.
# Linux-only: the compositor that feeds the software H.264 surface encoder
# only exists on Linux (see surface_encoder.rs). x264-sys links the system
# libx264 via pkg-config; openh264 compiles its bundled source.
x264-sys = { version = "0.2", optional = true }
openh264 = { version = "0.9", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_Globalization",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wat = "1"
rcgen = "0.14"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Validate the actual 10-bit surface bitstream with an independent decoder.
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_16"] }

wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
