[package]
name = "yas-proxy"
version = "0.2.0"
edition.workspace = true
description = "yas connection pool and protocol-transparent proxy"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "yas_proxy"
path = "src/lib.rs"

[dependencies]
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
web-transport-quinn = { version = "0.12", features = ["ring"] }
futures-util = "0.3"
bytes = "1"
rand = "0.10"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs"] }
serde_json = "1"
yas-webrtc-forwarder = { workspace = true }
yas-composite-transport = { workspace = true }
yas-uplink = { workspace = true }
yas-webserver = { workspace = true }
yas-ssh = { workspace = true }
yas-wire = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
