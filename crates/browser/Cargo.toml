[package]
name = "yas-browser"
version = "0.2.2"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
blake3 = { version = "1", default-features = false, features = ["std"] }
lz4_flex = { version = "0.14", default-features = false, features = ["alloc", "safe-decode", "safe-encode"] }
rustc-hash = "2"
wasm-bindgen = "=0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "Window",
]
