[package]
name = "yas-webrtc-forwarder"
version = "0.2.1"
edition.workspace = true
description = "Forward a yas server terminal over WebRTC"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "yas_webrtc_forwarder"
path = "src/lib.rs"

[dependencies]
yas-wire = { workspace = true }
yas-sd-notify = { workspace = true }
yas-webserver = { workspace = true }
yas-composite-transport = { workspace = true }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
ed25519-dalek = { version = "3", features = ["rand_core"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = "0.23.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "json"] }
hmac = "0.13"
pbkdf2 = "0.13"
sha1 = "0.11"
md-5 = "0.11"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
crypto_box = "0.9"
rand = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
